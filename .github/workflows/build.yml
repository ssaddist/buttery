name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: create-dmg
        run: brew install create-dmg

      - name: Тесты и сборка
        run: ./build.sh --dmg

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Buttery
          path: build/Buttery-*.dmg

